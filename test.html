<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Poker Engine Test UI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #0b3d2e;
      color: white;
    }

    .card {
      display: inline-block;
      background: white;
      color: black;
      border-radius: 8px;
      padding: 14px 10px;
      margin: 4px;
      min-width: 36px;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
    }

    .panel {
      background: rgba(255,255,255,0.12);
      padding: 18px;
      border-radius: 12px;
      margin: 16px 0;
    }

    button {
      padding: 10px 14px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 100px;
    }

    pre {
      background: #111;
      color: #0f0;
      padding: 12px;
      overflow-x: auto;
      border-radius: 8px;
      max-height: 260px;
    }

    .winner {
      font-size: 24px;
      color: #ffd700;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Texas Hold'em Poker Engine Test</h1>

  <button onclick="createGame()">New Game</button>

  <div class="panel">
    <h2>Game Info</h2>
    <p><strong>Stage:</strong> <span id="stage">-</span></p>
    <p><strong>Pot:</strong> <span id="pot">-</span></p>
    <p><strong>To Call:</strong> <span id="toCall">-</span></p>
    <p class="winner" id="winner"></p>
  </div>

  <div class="panel">
    <h2>Board</h2>
    <div id="board"></div>
  </div>

  <div class="panel">
    <h2>Hero</h2>
    <p>Stack: <span id="heroStack">-</span></p>
    <p>Current Bet: <span id="heroBet">-</span></p>
    <div id="heroCards"></div>
  </div>

  <div class="panel">
    <h2>Bot</h2>
    <p>Stack: <span id="botStack">-</span></p>
    <p>Current Bet: <span id="botBet">-</span></p>
    <div id="botCards"></div>
  </div>

  <div class="panel">
    <h2>Actions</h2>
    <input id="amountInput" type="number" placeholder="Amount" value="50" />

    <div id="actionButtons"></div>
  </div>

  <div class="panel">
    <h2>Log</h2>
    <ul id="log"></ul>
  </div>

  <div class="panel">
    <h2>Raw API State</h2>
    <pre id="rawState"></pre>
  </div>

  <script>
    const API_BASE = "https://poker-engine-49qmnpusi-mina1256s-projects.vercel.app";

    let gameState = null;
    let publicState = null;

    function renderCards(elementId, cards) {
      const element = document.getElementById(elementId);
      element.innerHTML = "";

      if (!cards || cards.length === 0) {
        element.textContent = "-";
        return;
      }

      for (const card of cards) {
        const div = document.createElement("div");
        div.className = "card";
        div.textContent = card;
        element.appendChild(div);
      }
    }

    function render() {
      if (!publicState) return;

      document.getElementById("stage").textContent = publicState.stage;
      document.getElementById("pot").textContent = publicState.pot;
      document.getElementById("toCall").textContent = publicState.to_call;

      document.getElementById("heroStack").textContent = publicState.hero.stack;
      document.getElementById("heroBet").textContent = publicState.hero.current_bet;

      document.getElementById("botStack").textContent = publicState.bot.stack;
      document.getElementById("botBet").textContent = publicState.bot.current_bet;

      renderCards("board", publicState.board);
      renderCards("heroCards", publicState.hero.cards);
      renderCards("botCards", publicState.bot.cards);

      const winnerEl = document.getElementById("winner");
      if (publicState.game_over) {
        winnerEl.textContent = `Winner: ${publicState.winner}`;
      } else {
        winnerEl.textContent = "";
      }

      const actionButtons = document.getElementById("actionButtons");
      actionButtons.innerHTML = "";

      for (const action of publicState.legal_actions || []) {
        const button = document.createElement("button");
        button.textContent = action.toUpperCase();
        button.onclick = () => sendAction(action);
        actionButtons.appendChild(button);
      }

      const log = document.getElementById("log");
      log.innerHTML = "";

      for (const line of publicState.log || []) {
        const li = document.createElement("li");
        li.textContent = line;
        log.appendChild(li);
      }

      document.getElementById("rawState").textContent = JSON.stringify(
        { gameState, publicState },
        null,
        2
      );
    }

    async function createGame() {
      try {
        const res = await fetch(`${API_BASE}/games`, {
          method: "POST",
        });

        const data = await res.json();

        if (!res.ok) {
          alert("Error creating game: " + JSON.stringify(data));
          return;
        }

        gameState = data.game_state;
        publicState = data.state;

        render();
      } catch (err) {
        alert("Could not connect to API. Check deployment/CORS. " + err);
      }
    }

    async function sendAction(action) {
      if (!gameState) {
        alert("Create a game first.");
        return;
      }

      const amountInput = document.getElementById("amountInput");
      const amountValue = parseInt(amountInput.value, 10);

      let amount = null;

      if (action === "bet" || action === "raise") {
        amount = amountValue;

        if (!amount || amount <= 0) {
          alert("Enter a valid amount.");
          return;
        }
      }

      try {
        const res = await fetch(`${API_BASE}/action`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            game_state: gameState,
            action,
            amount,
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          alert("Action error: " + JSON.stringify(data));
          return;
        }

        gameState = data.game_state;
        publicState = data.state;

        render();
      } catch (err) {
        alert("Could not send action. " + err);
      }
    }
  </script>
</body>
</html>
